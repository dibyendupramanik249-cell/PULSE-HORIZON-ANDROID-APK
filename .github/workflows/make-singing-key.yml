name: Create signing key (run ONCE)

# Creates Pulse Horizon's permanent signing key on GitHub's build server
# (a phone cannot do this - there is no keytool on Android), encrypts it with
# your password, and commits the ENCRYPTED file to the repo.
# Your password itself is only ever stored in GitHub's encrypted Secrets.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the password secret exists
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "ERROR: Add the repository secret KEYSTORE_PASSWORD first."
            echo "Repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

      - name: Create the keystore and encrypt it
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p .github/signing
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias pulsehorizon \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Pulse Horizon, O=Dibyendu Pramanik, C=IN"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in release.keystore -out .github/signing/release.keystore.enc -pass pass:"$PW"
          rm -f release.keystore
          echo "Keystore created and encrypted."

      - name: Commit the encrypted keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/signing/release.keystore.enc
          git commit -m "Add encrypted release signing keystore"
          git push
