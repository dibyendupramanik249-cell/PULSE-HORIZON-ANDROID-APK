name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle wrapper and debug key
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env

      - name: Is the release signing key configured?
        id: key
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$PW" ] && [ -f ".github/signing/release.keystore.enc" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Decrypt the release keystore
        if: steps.key.outputs.present == 'true'
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p signing
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/signing/release.keystore.enc -out signing/release.keystore -pass pass:"$PW"

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --console=plain > build.log 2>&1
          code=$?
          echo "======== KOTLIN / GRADLE ERRORS ========"
          grep -E "^e: |^w: |error:|FAILED|What went wrong" build.log | head -40
          echo "======== END OF ERRORS ========"
          exit $code

      - name: Build signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/signing/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: pulsehorizon
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pulse-horizon-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
